name: CI

on:
  push:
    branches: [main, master, "feature/**", "fix/**", "refactor/**"]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run targeted pytest suite
        env:
          PYTHONPATH: enterprise_rag/src
        run: |
          python -m pytest \
            tests/test_exam_tenant_authorization.py \
            tests/test_exam_chat_security.py \
            tests/test_tenant_context.py \
            tests/unit/test_retrieval_mode_router.py \
            tests/test_hybrid_search_modes.py \
            tests/test_chat_pipeline_routing.py \
            tests/test_persistence_database.py \
            tests/test_local_trace.py \
            tests/test_langfuse_trace.py \
            tests/test_stream_tracer.py \
            tests/e2e/test_api_smoke.py \
            -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        run: |
          npm ci
          npm run build
